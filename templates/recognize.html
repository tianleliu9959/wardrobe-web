// 折叠/展开裁剪预览（完成态自动收起，把空间让给结果）
function setCropPanelCollapsed(collapsed) {
  const p = document.getElementById("crop-panel");
  const t = document.getElementById("crop-toggle");
  if (!p) return;
  p.classList.toggle("collapsed", !!collapsed);
  if (t) t.textContent = collapsed ? "▸ 展开预览" : "▾ 收起预览";
}

// 裁剪预览区 + 粗排区占位（用于定位/暂停/待重跑阶段）
function renderCropPanel(data, coarse) {
  const result = document.getElementById("result");
  const inner = coarse && coarse.length
    ? '' : '<div class="empty">（未跑粗排，裁剪不准可暂停/重新框选）</div>';
  result.innerHTML = cropPanelHTML() + `<div id="coarse-wrap">${inner}</div>`;
  bindCropButtons();
  updateCropButtons();
  // 定位/暂停/待重跑：桌面端保持展开看框；手机端默认折叠，避免原图撑爆整屏，点「展开预览」再手动看
  const isMobile = window.matchMedia("(max-width: 768px)").matches;
  setCropPanelCollapsed(isMobile ? true : false);
}

// 按钮显示状态机
function updateCropButtons() {
  const show = id => { const el = document.getElementById(id); if (el) el.style.display = 'inline-block'; };
  const hide = id => { const el = document.getElementById(id); if (el) el.style.display = 'none'; };
  const tip = document.getElementById("crop-tip");
  const stage = document.getElementById("crop-stage");
  const boxEl = document.getElementById("crop-box");
  // busy（精排比对/裁剪请求/关联中）：裁剪类按钮一律隐藏，「开始查询」禁用，防止流程互相打架
  // 注意：粗排中(locating)可暂停、粗排完成(ready)后可重新框选，均不在此列
  const busy = associating || cropPhase === "cropping" || cropPhase === "precise";
  if (busy) {
    ["crop-pause", "crop-redraw", "crop-confirm", "crop-cancel", "crop-rerun", "crop-reedit"].forEach(hide);
    const startBtn = document.getElementById("btn-start");
    if (startBtn) startBtn.disabled = true;
    if (tip) tip.textContent = associating ? "关联中，暂不能裁剪…" : "识别比对中，暂不能裁剪…";
    if (associating) {  // 关联中同时禁用精排入口，避免与关联循环并发
      const pb = document.getElementById("precise-btn");
      if (pb) pb.disabled = true;
    }
    return;
  }
  ["crop-pause", "crop-redraw", "crop-confirm", "crop-cancel", "crop-rerun", "crop-reedit", "precise-btn", "confirm-btn"].forEach(hide);
  if (stage) stage.classList.remove("drawing");
  if (boxEl) boxEl.classList.remove("editing");
  if (tip) tip.textContent = "";
  switch (cropPhase) {
    case "locating":
      show("crop-pause");
      if (tip) tip.textContent = "粗排召回中… 裁剪不准可点「暂停粗排」重新框选";
      break;
    case "editing":
      show("crop-redraw"); show("crop-confirm"); show("crop-cancel");
      if (tip) tip.textContent = "拖动框体移动，拖四角缩放，或点「重画」重新拖一个框";
      if (stage) stage.classList.add("drawing");
      if (boxEl) boxEl.classList.add("editing");
      break;
    case "rerun_ready":
      show("crop-rerun"); show("crop-reedit");
      if (tip) tip.textContent = "新裁剪图已生成，点「接着跑粗排」用新框召回（跳过定位，只跑比对）";
      break;
    case "ready":
      show("crop-reedit");
      if (tip) tip.textContent = "裁剪不准可点「重新框选」调整后重跑粗排";
      break;
  }
}

// 归一化框(0-1000) ↔ 原图显示像素
function normToPx(stage, box) {
  const img = stage.querySelector("img");
  const w = (img && img.clientWidth) || 1, h = (img && img.clientHeight) || 1;
  return { x: box[0] / 1000 * w, y: box[1] / 1000 * h,
           w: (box[2] - box[0]) / 1000 * w, h: (box[3] - box[1]) / 1000 * h };
}
function pxToNorm(stage, r) {
  const img = stage.querySelector("img");
  const w = (img && img.clientWidth) || 1, h = (img && img.clientHeight) || 1;
  return [Math.round(r.x / w * 1000), Math.round(r.y / h * 1000),
          Math.round((r.x + r.w) / w * 1000), Math.round((r.y + r.h) / h * 1000)];
}
function getBoxRect(boxEl) {
  return { x: parseFloat(boxEl.style.left) || 0, y: parseFloat(boxEl.style.top) || 0,
           w: parseFloat(boxEl.style.width) || 0, h: parseFloat(boxEl.style.height) || 0 };
}
function applyBoxPx(stage, boxEl, r) {
  r.w = Math.max(4, r.w); r.h = Math.max(4, r.h);
  boxEl.style.left = r.x + "px"; boxEl.style.top = r.y + "px";
  boxEl.style.width = r.w + "px"; boxEl.style.height = r.h + "px";
  boxEl.style.display = "block";
  const coord = document.getElementById("crop-coord");
  if (coord) coord.textContent = "坐标 [" + pxToNorm(stage, r).join(",") + "]";
}

// 拖动/缩放手柄
function startDrag(stage, boxEl, e, mode) {
  e.preventDefault();
  dragState = { mode, startX: e.clientX, startY: e.clientY, orig: getBoxRect(boxEl) };
  document.addEventListener("mousemove", onDragMove);
  document.addEventListener("mouseup", onDragEnd);
}
function onDragMove(e) {
  if (!dragState) return;
  const dx = e.clientX - dragState.startX, dy = e.clientY - dragState.startY;
  const o = dragState.orig;
  const stage = document.getElementById("crop-stage");
  const img = stage.querySelector("img");
  const W = (img && img.clientWidth) || 1, H = (img && img.clientHeight) || 1;
  let r;
  if (dragState.mode === "move") {
    r = { x: o.x + dx, y: o.y + dy, w: o.w, h: o.h };
  } else {
    const dir = dragState.mode.replace("resize-", "");
    let { x, y, w, h } = o;
    if (dir.includes("l")) { x = Math.min(o.x + dx, o.x + o.w - 4); w = o.x + o.w - x; }
    if (dir.includes("r")) { w = Math.max(4, o.w + dx); }
    if (dir.includes("t")) { y = Math.min(o.y + dy, o.y + o.h - 4); h = o.y + o.h - y; }
    if (dir.includes("b")) { h = Math.max(4, o.h + dy); }
    r = { x, y, w, h };
  }
  r.x = Math.max(0, Math.min(r.x, W - 4));
  r.y = Math.max(0, Math.min(r.y, H - 4));
  r.w = Math.max(4, Math.min(r.w, W - r.x));
  r.h = Math.max(4, Math.min(r.h, H - r.y));
  applyBoxPx(stage, document.getElementById("crop-box"), r);
}
function onDragEnd() {
  dragState = null;
  document.removeEventListener("mousemove", onDragMove);
  document.removeEventListener("mouseup", onDragEnd);
}

// 重画：在原图上拖新框
function startDrawMode(stage, boxEl) {
  stage.classList.add("drawing");
  boxEl.style.display = "none";
  const tip = document.getElementById("crop-tip");
  if (tip) tip.textContent = "在原图上按住拖动画一个新框";
}
function startDrawDrag(stage, boxEl, e) {
  if (e.button !== 0 || e.target === boxEl || boxEl.contains(e.target)) return;
  e.preventDefault();
  const img = stage.querySelector("img");
  const rect = img.getBoundingClientRect();
  const startX = e.clientX - rect.left, startY = e.clientY - rect.top;
  drawState = { startX, startY };
  const onMove = (ev) => {
    const x = Math.max(0, Math.min(ev.clientX - rect.left, img.clientWidth));
    const y = Math.max(0, Math.min(ev.clientY - rect.top, img.clientHeight));
    applyBoxPx(stage, boxEl, { x: Math.min(startX, x), y: Math.min(startY, y),
                               w: Math.abs(x - startX), h: Math.abs(y - startY) });
  };
  const onUp = () => {
    drawState = null;
    stage.classList.remove("drawing");
    document.removeEventListener("mousemove", onMove);
    document.removeEventListener("mouseup", onUp);
  };
  document.addEventListener("mousemove", onMove);
  document.addEventListener("mouseup", onUp);
}

// 确认框选 → 带 box 重裁（跳过 grounding）
function confirmCrop(stage, boxEl) {
  const r = getBoxRect(boxEl);
  if (r.w < 4 || r.h < 4) { toast("框选太小，请重画"); return; }
  cropBox = pxToNorm(stage, r);
  startCrop(cropBox);
}
// 取消编辑
function cancelEdit(stage, boxEl) {
  if (lastResultData && lastResultData.crop_file === cropFile) {
    cropPhase = "ready";
    renderResult(lastResultData, null);
  } else {
    // 裁剪图已更新但尚未跑粗排：回到等待手动开始（点「接着跑粗排」）
    cropPhase = "rerun_ready";
    renderCropPanel(null, null);
    saveCropReady();
  }
}

// 绑定裁剪预览区按钮 + 框选交互
function bindCropButtons() {
  const stage = document.getElementById("crop-stage");
  const boxEl = document.getElementById("crop-box");
  if (!stage || !boxEl) return;

  const bind = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };

  // 裁剪预览缩放：改图片显示高度（宽度等比），坐标换算依赖 img.clientWidth/Height 自动跟随
  const zoomImg = () => {
    const img = stage.querySelector("img");
    if (!img) return;
    img.style.height = Math.round(300 * cropZoom) + "px";
    img.style.width = "auto";
    const v = document.getElementById("zoom-val");
    if (v) v.textContent = Math.round(cropZoom * 100) + "%";
    // 缩放后按新显示尺寸重算框位置（归一化坐标不变）
    if (cropBox && cropBox.length === 4) applyBoxPx(stage, boxEl, normToPx(stage, cropBox));
  };
  const zoomBy = (d) => {
    cropZoom = Math.min(3, Math.max(0.6, Math.round((cropZoom + d) * 100) / 100));
    zoomImg();
  };
  bind("zoom-in", () => zoomBy(0.2));
  bind("zoom-out", () => zoomBy(-0.2));
  bind("zoom-reset", () => { cropZoom = 1; zoomImg(); });
  stage.addEventListener("wheel", (e) => {
    if (!(e.ctrlKey || e.metaKey)) return;  // 普通滚轮留给舞台滚动
    e.preventDefault();
    zoomBy(e.deltaY < 0 ? 0.1 : -0.1);
  }, { passive: false });
  zoomImg();  // 应用上次/初始缩放

  bind("crop-toggle", () => {
    const p = document.getElementById("crop-panel");
    setCropPanelCollapsed(!(p && p.classList.contains("collapsed")));
  });
  bind("crop-pause", () => pauseRecall());
  bind("crop-redraw", () => startDrawMode(stage, boxEl));
  bind("crop-confirm", () => confirmCrop(stage, boxEl));
  bind("crop-cancel", () => cancelEdit(stage, boxEl));
  bind("crop-rerun", () => runRecall());
  bind("crop-reedit", () => {
    cropPhase = "editing";
    setCropPanelCollapsed(false);  // 重新框选：展开预览
    updateCropButtons();
    applyBoxPx(stage, boxEl, normToPx(stage, cropBox));
  });

  // 框体拖动（移动）
  boxEl.onmousedown = (e) => {
    if (cropPhase !== "editing" || e.target.classList.contains("crop-handle")) return;
    startDrag(stage, boxEl, e, "move");
  };
  // 四角缩放
  boxEl.querySelectorAll(".crop-handle").forEach(h => {
    h.onmousedown = (e) => {
      if (cropPhase !== "editing") return;
      e.stopPropagation();
      startDrag(stage, boxEl, e, "resize-" + h.dataset.dir);
    };
  });
  // 重画模式：在 stage 上拖新框
  stage.onmousedown = (e) => {
    if (cropPhase !== "editing" || !stage.classList.contains("drawing")) return;
    startDrawDrag(stage, boxEl, e);
  };

  // 初始把归一化框映射为像素框
  if (cropBox && cropBox.length === 4) applyBoxPx(stage, boxEl, normToPx(stage, cropBox));
}

async function renderHistoryResult(log, target) {
  // target 为弹窗容器时：渲染进弹窗，不触碰主工作台（隐藏 dock / 切 tab / 改步骤条都不做）
  const inModal = !!target;
  const result = target || document.getElementById("result");
  if (!inModal) {
    // 历史详情回显：隐藏 dock 的识别操作按钮（历史详情只保留 back-btn 返回）
    DOCK_BTN_IDS.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = "none";
    });
  }
  // 非独立详情页且非弹窗：若当前在历史 tab，切回识别工作台以显示回显结果
  if (!standaloneLog && !inModal && document.getElementById("pane-history").classList.contains("active")) {
    switchTab("recognize");
  }
  const isPreciseLog = log.kind === "precise" || log.types === "精排" || Array.isArray(log.precise_hits);
  const top = log.top || [];
  if (!inModal) setStage({ done: isPreciseLog ? 4 : 3, title: `结果 · 详情 ${log.types}` });
  if (!top.length) {
    result.innerHTML = `<div class="empty">该条记录无候选列表</div>`;
    return;
  }
  const hitNames = (isPreciseLog && log.precise_hits) ? log.precise_hits : [];
  const hitSet = new Set(hitNames);

  // 查询当前心愿单状态（用于显示心标）
  let wishedSet = new Set();
  try {
    const w = await fetch("/api/wishlist");
    const wd = await w.json();
    wishedSet = new Set((wd.items || []).map(x => String(x.item_id)));
  } catch (e) {}

  let html = `<div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; flex-wrap:wrap;">
    <div style="font-size:12px; color:var(--muted);">
      ${log.time} · ${log.types} · ${isPreciseLog ? '精排' : '粗排'} · 耗时 ${fmtDur(log.elapsed)}
      ${log.file ? `· <a href="javascript:void(0)" onclick="showLightbox('/uploads/${log.file}')" style="color:var(--primary);">查看原图</a>` : ''}
      ${log.crop_file ? `· <a href="javascript:void(0)" onclick="showLightbox('/uploads/${log.crop_file}')" style="color:var(--primary);">查看裁剪图</a>` : ''}
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      ${!inModal ? `<button id="back-btn" style="width:auto; padding:4px 12px; font-size:12px;">← 返回</button>` : ''}
    </div>
  </div>`;

  html += `<div class="cand-grid">`;
  top.forEach((m) => {
    const alias = m.alias ? `（${m.alias}）` : "";
    const hit = isPreciseLog && hitSet.has(m.name);
    const big = m.image_big || m.image || "";
    // 始终渲染占位 img（带 data-itemid），有图用图、无图靠下方按 item_id 查库补图
    const img = `<img class="preview" src="${big}" loading="lazy" onerror="this.style.visibility='hidden'" data-big="${big}" data-itemid="${m.item_id || ''}" title="点击查看大图">`;
    const wished = wishedSet.has(String(m.item_id));
    const heartBtn = m.item_id
      ? `<button class="heart-btn ${wished ? 'on' : ''}" data-itemid="${m.item_id}" title="加入/移出心愿单">${wished ? '♥' : '♡'}</button>`
      : '';
    const setBtn = m.set_id
      ? `<button class="goto-set" data-setid="${m.set_id}">套装</button>`
      : '';
    // 散件来源：可点击查看来源详情（obtain），点击弹窗查询最新数据
    const looseTag = m.set_id
      ? ''
      : ` · <span class="loose-tag loose-link" data-itemid="${m.item_id || ''}" title="点击查看散件来源详情">散件${m.obtain ? '-来源：' + shortObtain(m.obtain) : '来源'}</span>`;
    // 精排命中项默认勾选，保留精排选中状态
    const checked = hit ? "checked" : "";
    html += `
      <div class="cand ${hit ? 'hit' : ''}">
        ${img}
        <div class="info">
          <div class="cand-top">
            <input type="checkbox" class="confirm-cb" data-itemid="${m.item_id || ''}" ${checked} title="勾选后关联截图">
            <div class="name">${m.name || ''}<span class="alias">${alias}</span></div>
            ${heartBtn}
          </div>
          <div class="meta">${m.type || ''} · ${'★'.repeat(parseInt(m.star)||5)} · 相似 ${m.sim ?? ''}${m.set_id ? (m.set_name ? ' · ' + m.set_name : '') : looseTag}</div>
          <div class="cand-actions">${setBtn}</div>
        </div>
      </div>`;
  });
  html += `</div>`;

  html += `<div style="display:flex; justify-content:flex-end; gap:8px; margin-top:12px;">
    <button class="primary" id="echo-link-btn" style="width:auto;">关联截图到勾选项（自动加心标）</button>
  </div>`;
  result.innerHTML = html;

  // 新日志不存长路径：对无图的卡片按 item_id 查库补大图（旧日志有 image_big 则跳过）
  for (const imgEl of result.querySelectorAll("img.preview")) {
    if (imgEl.dataset.big) continue;  // 旧日志已有图
    const card = imgEl.closest(".cand");
    const cb = card && card.querySelector(".confirm-cb");
    const itemId = cb && cb.dataset.itemid;
    if (!itemId) continue;
    try {
      const r = await fetch(`/api/part/image?item_id=${itemId}`);
      const d = await r.json();
      const src = d.image_big || d.image;
      if (src) {
        imgEl.src = src;
        imgEl.dataset.big = src;
        imgEl.style.visibility = "visible";
      }
    } catch (e) {}
  }

  // "返回"按钮：独立日志详情页直接回上一页（弹窗内不渲染该按钮，仅靠右上角 × 关闭）
  const backBtn = result.querySelector("#back-btn");
  if (backBtn) backBtn.addEventListener("click", () => {
    if (standaloneLog) { history.back(); return; }
    if (inModal) { closeModal(); return; }
    if (recognizing) {
      // 识别进行中：始终显示"识别中"占位，不要回显旧的 top10（避免残留上次结果）
      document.getElementById("result").innerHTML = `<div class="empty">正在识别中…</div>`;
      setStage({ done: 1, active: 2, title: "结果 · 识别中", spinner: true });
    } else if (lastResultData) {
      renderResult(lastResultData, null);  // 标题/步骤由 renderResult 统一设置
    } else {
      document.getElementById("result").innerHTML = `<div class="empty">选择部位并上传截图后开始识别</div>`;
      setStage({ active: 1, title: "结果" });
    }
  });

  result.querySelectorAll(".cand img").forEach(im => {
    im.addEventListener("click", () => showLightbox(im.dataset.big || im.src));
  });

  // 每个候选的套装按钮：弹窗内打开套装（不中断识别页）
  result.querySelectorAll(".goto-set").forEach(btn => {
    btn.addEventListener("click", () => {
      const sid = parseInt(btn.dataset.setid, 10);
      if (sid) openSetModal(sid);
    });
  });
  result.querySelectorAll(".loose-link").forEach(el => {
    el.addEventListener("click", () => openLooseDetail(parseInt(el.dataset.itemid, 10)));
  });

  // 每个候选的心标按钮：切换心愿单
  result.querySelectorAll(".heart-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = parseInt(btn.dataset.itemid, 10);
      const r = await fetch("/api/wishlist/toggle", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({item_id: id}) });
      const rd = await r.json();
      const on = rd.in_wishlist;
      btn.textContent = on ? '♥' : '♡';
      btn.classList.toggle("on", on);
    });
  });

  // 关联截图：勾选项关联上传原图 + 自动加心标
  result.querySelector("#echo-link-btn").addEventListener("click", async () => {
    const cbs = [...result.querySelectorAll(".confirm-cb")].filter(c => c.checked);
    let ids = cbs.map(c => parseInt(c.dataset.itemid, 10)).filter(Boolean);
    if (!ids.length) {
      // 未勾选时默认关联精排命中项，否则 top1
      if (isPreciseLog && hitNames.length) {
        ids = top.filter(t => hitNames.includes(t.name)).map(t => t.item_id).filter(Boolean);
      }
      if (!ids.length) ids = top.filter(t => t.item_id).map(t => t.item_id).slice(0, 1);
    }
    if (!log.file) { alert("该记录无上传原图"); return; }
    const btn = result.querySelector("#echo-link-btn");
    btn.disabled = true; btn.textContent = "关联中…";
    for (const id of ids) {
      await fetch("/api/photo/link", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({item_id: id, file: log.file}) });
      await fetch("/api/wishlist/toggle", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({item_id: id, ensure: true}) });
    }
    btn.textContent = `已关联 ${ids.length} 个并加心标`;
    addWishlistEntry(btn);
  });
}

/* ---------- 大图弹层 ---------- */
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
function showLightbox(url) {
  if (!url) return;
  lightboxImg.src = url;
  lightbox.classList.add("show");
}
lightbox.addEventListener("click", () => lightbox.classList.remove("show"));
document.addEventListener("keydown", e => { if (e.key === "Escape") { lightbox.classList.remove("show"); closeModal(); } });

/* ---------- 内容级弹窗（详情 / 套装） ---------- */
const cmodal = document.getElementById("cmodal");
const cmodalBody = document.getElementById("cmodal-body");
const cmodalTitle = document.getElementById("cmodal-title");
function openModal(title, html) {
  cmodalTitle.textContent = title;
  cmodalBody.innerHTML = html || "";
  cmodal.classList.add("show");
}

// 散件来源详情：按 item_id 查最新数据弹窗展示（名称/部位/星级/来源/大图）
function shortObtain(s) { s = String(s || ""); return s.length > 22 ? s.slice(0, 22) + "…" : s; }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
async function openLooseDetail(itemId) {
  if (!itemId) return;
  openModal("散件详情", `<div class="empty">加载中…</div>`);
  try {
    const res = await fetch(`/api/part/image?item_id=${itemId}`);
    const d = await res.json();
    if (!d.name && !d.obtain && !d.image_big) {
      cmodalBody.innerHTML = `<div class="empty">部件不存在或已删除</div>`;
      return;
    }
    const star = "★".repeat(parseInt(d.star) || 0) || "—";
    const img = d.image_big || d.image;
    cmodalBody.innerHTML = `
      <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start;">
        ${img ? `<img src="${esc(img)}" style="max-width:220px; max-height:300px; border-radius:10px; object-fit:contain; box-shadow:var(--shadow);" onerror="this.style.display='none'">` : ""}
        <div style="flex:1; min-width:260px; line-height:2; font-size:14px;">
          <div><b>部件：</b>${esc(d.name) || "—"}</div>
          <div><b>部位：</b>${esc(d.type) || "—"}</div>
          <div><b>星级：</b><span style="color:#c0392b; font-weight:600;">${star}</span></div>
          <div><b>来源：</b>${esc(d.obtain) || "—"}</div>
        </div>
      </div>`;
  } catch (e) {
    cmodalBody.innerHTML = `<div class="empty">加载失败：${esc(e.message || e)}</div>`;
  }
}
function closeModal() {
  cmodal.classList.remove("show");
  cmodalBody.innerHTML = "";
}
document.getElementById("cmodal-close").addEventListener("click", closeModal);
cmodal.addEventListener("click", e => { if (e.target === cmodal) closeModal(); });

// 历史日志详情 → 弹窗内渲染（复用 renderHistoryResult，完整信息零丢失）
async function openLogDetail(id) {
  openModal("日志详情", `<div class="empty">加载中…</div>`);
  try {
    const res = await fetch(`/api/recognize/log/${id}`);
    const d = await res.json();
    if (!d.log) { cmodalBody.innerHTML = `<div class="empty">日志不存在</div>`; return; }
    cmodalTitle.textContent = `日志详情 ${d.log.id ? `#${d.log.id}` : ''} · ${d.log.types}`;
    await renderHistoryResult(d.log, cmodalBody);
  } catch (e) {
    cmodalBody.innerHTML = `<div class="empty" style="color:#c0392b;">加载失败：${e}</div>`;
  }
}

// 套装详情 → 弹窗内响应式网格（数据来自 GET /api/set/<id>）
async function openSetModal(sid) {
  openModal("套装详情", `<div class="empty">加载中…</div>`);
  try {
    const res = await fetch(`/api/set/${sid}`);
    const d = await res.json();
    if (!d.set) { cmodalBody.innerHTML = `<div class="empty">套装不存在</div>`; return; }
    renderSetModal(d);
  } catch (e) {
    cmodalBody.innerHTML = `<div class="empty" style="color:#c0392b;">加载失败：${e}</div>`;
  }
}
function renderSetModal(d) {
  const s = d.set;
  const items = d.items || [];
  const wished = new Set((d.wished || []).map(String));
  cmodalTitle.textContent = `套装 · ${s.name}`;
  let html = `<div style="display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; margin-bottom:14px;">
    ${s.preview ? `<img src="${s.preview}" data-big="${s.preview}" style="width:150px; border-radius:10px; border:1px solid var(--border); object-fit:contain; background:#faf8f3; cursor:zoom-in;" title="点击查看大图">` : ""}
    <div>
      <div style="font-size:17px; font-weight:700;">${s.name}${s.alias ? ` <span style="font-size:13px; color:var(--muted);">（${s.alias}）</span>` : ""}</div>
      <div style="font-size:13px; color:var(--muted); margin-top:6px;">${s.star} 星 · ${s.obtain || "未知来源"}${s.attribute ? ` · 风格：${s.attribute}` : ""}</div>
      <div style="font-size:12px; color:var(--muted); margin-top:4px;">部件 ${items.length} 件</div>
    </div>
  </div>`;
  html += `<div class="set-items">`;
  items.forEach(i => {
    const w = wished.has(String(i.id));
    html += `<div class="set-item ${i.owned ? "owned" : ""}" data-itemid="${i.id}">
      ${i.image ? `<img src="${i.image}" data-big="${i.image_big || i.image}" loading="lazy" title="点击查看大图">` : `<div style="height:130px; display:flex; align-items:center; color:var(--muted); font-size:12px;">无图</div>`}
      <div class="name">${i.name}</div>
      <div class="type">${i.type}${i.star ? ` · ${i.star}星` : ""}</div>
      <button class="heart-btn ${w ? "on" : ""}" data-itemid="${i.id}" title="加入/移出心愿单">${w ? "♥" : "♡"}</button>
      <label class="owned-toggle"><input type="checkbox" ${i.owned ? "checked" : ""}> 已拥有</label>
    </div>`;
  });
  html += `</div>`;
  cmodalBody.innerHTML = html;
  cmodalBody.querySelectorAll(".set-item img").forEach(im => {
    im.addEventListener("click", () => showLightbox(im.dataset.big || im.src));
  });
  cmodalBody.querySelectorAll(".heart-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const itemId = parseInt(btn.dataset.itemid, 10);
      const r = await fetch("/api/wishlist/toggle", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ item_id: itemId }),
      });
      const rd = await r.json();
      btn.classList.toggle("on", !!rd.in_wishlist);
      btn.textContent = rd.in_wishlist ? "♥" : "♡";
    });
  });
  cmodalBody.querySelectorAll(".owned-toggle input").forEach(cb => {
    cb.addEventListener("change", async () => {
      const card = cb.closest(".set-item");
      const itemId = parseInt(card.dataset.itemid, 10);
      try {
        await fetch("/api/owned", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ item_id: itemId, owned: cb.checked ? 1 : 0 }),
        });
        card.classList.toggle("owned", cb.checked);
      } catch (e) { /* 静默失败，复选框状态保持原样由用户重试 */ }
    });
  });
}

// 初始化：独立日志详情页（/recognize/log/<id>）→ 自动定位渲染该条日志
const mLogId = location.pathname.match(/^\/recognize\/log\/(\d+)$/);
if (mLogId) {
  standaloneLog = true;
  // 独立详情页：隐藏 Tab 与底部操作栏，只保留详情内容
  document.querySelectorAll(".tabs").forEach(el => el.style.display = "none");
  const dockEl = document.querySelector(".bottom-dock");
  if (dockEl) dockEl.style.display = "none";
  (async () => {
    const box = document.getElementById("result");
    try {
      const res = await fetch(`/api/recognize/log/${mLogId[1]}`);
      const d = await res.json();
      if (d.log) {
        setStage({ title: "结果 · 日志详情" });
        renderHistoryResult(d.log);
      } else {
        box.innerHTML = `<div class="empty">日志不存在或已被清理</div>`;
        setStage({ title: "结果 · 日志详情" });
      }
    } catch (e) {
      box.innerHTML = `<div class="empty">加载失败：${e}</div>`;
      setStage({ title: "结果 · 日志详情" });
    }
  })();
}

/* ---------- Tab 切换：识别工作台 / 历史独立页 ---------- */
const tabBtns = document.querySelectorAll(".tab");
const DOCK_BTN_IDS = ["precise-btn", "confirm-btn", "crop-rerun", "crop-reedit", "crop-confirm", "crop-cancel", "crop-pause", "crop-redraw"];
function switchTab(name) {
  tabBtns.forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  document.querySelectorAll(".tab-pane").forEach(p => p.classList.toggle("active", p.id === `pane-${name}`));
  if (name === "history") {
    loadHistory();
    DOCK_BTN_IDS.forEach(id => { const el = document.getElementById(id); if (el) el.style.display = "none"; });
  } else {
    // 切回识别工作台：按 cropPhase 恢复裁剪按钮；结果有候选时恢复精排/关联入口
    updateCropButtons();
    if (document.querySelector("#result .cand-grid")) {
      ["precise-btn", "confirm-btn"].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = 'inline-block';
      });
    }
  }
}
tabBtns.forEach(btn => btn.addEventListener("click", () => switchTab(btn.dataset.tab)));

/* ---------- 历史搜索：按部件名/套装筛选（全量过滤后分页渲染） ---------- */
const histSearch = document.getElementById("hist-search");
histSearch.addEventListener("input", () => {
  histPage = 1;
  if (histLogs.length) renderHist();
});

/* ---------- 识别任务断点续跑：页面刷新/跳转后回来，自动续上后台任务 ---------- */
function saveSessionTask(kind) {
  try {
    sessionStorage.setItem("yslz_task", JSON.stringify({
      task_id: cropTaskId, kind,
      crop_file: cropFile, crop_orig: cropOrigFile || lastFileName, types: cropTypes, box: cropBox,
      coarse: lastCoarse || [], time: Date.now()
    }));
  } catch (e) { /* sessionStorage 满或不可用，忽略 */ }
}
function clearSessionTask() {
  try { sessionStorage.removeItem("yslz_task"); } catch (e) {}
}
// 裁剪请求前的落盘：fetch 被打断/导航时保留，回来自动重跑（后端幂等，可安全重提交）
function saveCropPending(box) {
  try {
    sessionStorage.setItem("yslz_crop_pending", JSON.stringify({
      lastFileName, types: typeSel.value, box: box || null, time: Date.now()
    }));
  } catch (e) { /* sessionStorage 满或不可用，忽略 */ }
}
function clearCropPending() {
  try { sessionStorage.removeItem("yslz_crop_pending"); } catch (e) {}
}
// 裁剪完成、手动框待确认时的落盘：离开页面回来可恢复「接着跑粗排」按钮态
function saveCropReady() {
  try {
    sessionStorage.setItem("yslz_crop_ready", JSON.stringify({
      crop_file: cropFile, crop_orig: cropOrigFile || lastFileName,
      types: cropTypes, box: cropBox || null, time: Date.now()
    }));
  } catch (e) { /* sessionStorage 满或不可用，忽略 */ }
}
function clearCropReady() {
  try { sessionStorage.removeItem("yslz_crop_ready"); } catch (e) {}
}

(async () => {
  if (standaloneLog) return;  // 独立详情页无识别工作台，不恢复

  // ---- 1) 进行中的后台任务（crop/recall/precise）：轮询续跑 ----
  let s = null;
  try { s = JSON.parse(sessionStorage.getItem("yslz_task") || "null"); } catch (e) {}
  if (s && s.task_id) {
    // 重建识别上下文
    if (s.crop_file) { cropFile = s.crop_file; lastCropFile = s.crop_file; }
    if (s.crop_orig) { cropOrigFile = s.crop_orig; lastFileName = s.crop_orig; }
    if (s.types) { cropTypes = s.types; typeSel.value = s.types; }  // 同步下拉框，续跑粗排部位不丢
    if (s.box) cropBox = s.box;
    if (Array.isArray(s.coarse) && s.coarse.length) lastCoarse = s.coarse;

    const r = await pollTask(s.task_id);
    clearSessionTask();
    if (r.status === "done") {
      const data = { file: cropOrigFile, crop_file: cropFile, box: cropBox, coarse: lastCoarse };
      lastResultData = data;
      cropPhase = "ready";
      if (s.kind === "precise") {
        const hitIds = (r.result && r.result.hit_ids) || [];
        updateCropButtons();
        renderResult(data, hitIds);
        toast(hitIds.length ? `识别已完成，精排命中 ${hitIds.length} 个` : "识别已完成，精排未命中");
      } else if (s.kind === "crop") {
        // 裁剪任务完成：手动框 → 待确认；自动 → 直接续跑粗排
        const d = r.result || {};
        if (d.file) { lastFileName = d.file; cropOrigFile = d.file; }
        else if (cropOrigFile) { lastFileName = cropOrigFile; }  // d.file 缺失时回退已恢复的原图
        if (d.crop_file) { cropFile = d.crop_file; lastCropFile = d.crop_file; }
        if (d.box) cropBox = d.box;
        cropTypes = s.types || cropTypes;
        if (s.box) {
          cropPhase = "rerun_ready";
          renderCropPanel(d, null);
          setStage({ done: 2, title: "结果 · 已裁剪，确认框选后点「接着跑粗排」" });
          saveCropReady();
          toast("裁剪已完成，确认框选后点「接着跑粗排」");
        } else {
          cropPhase = "locating";
          renderCropPanel(d, null);
          toast("正在自动续跑粗排…");
          await runRecall();
        }
      } else if (r.result && !r.result.error) {
        const d = r.result;
        d.file = cropOrigFile; d.crop_file = cropFile; d.box = cropBox;
        lastCoarse = d.coarse || [];
        lastResultData = d;
        renderResult(d, null);
        toast("识别已完成（离开页面后自动续上）");
      } else {
        toast(`识别失败：${(r.result && r.result.error) || "未知错误"}`);
      }
    } else if (r.status === "error") {
      toast(`上次识别失败：${r.error || "任务已失效"}（结果可在历史查看）`);
    } else if (r.status === "cancelled") {
      toast("上次识别已暂停，结果可在历史查看");
    }
    loadHistory();
    return;
  }

  // ---- 2) 裁剪已完成、手动框待确认（等用户点「接着跑粗排」） ----
  let p = null;
  try { p = JSON.parse(sessionStorage.getItem("yslz_crop_ready") || "null"); } catch (e) {}
  if (p && p.crop_file) {
    cropFile = p.crop_file; lastCropFile = p.crop_file;
    cropOrigFile = p.crop_orig; lastFileName = p.crop_orig;
    cropTypes = p.types || cropTypes || typeSel.value;
    if (cropTypes) typeSel.value = cropTypes;  // 同步下拉框，方便直接改部位
    cropBox = p.box || null;
    cropPhase = "rerun_ready";
    renderCropPanel(null, null);
    setStage({ done: 2, title: "结果 · 已裁剪，确认框选后点「接着跑粗排」" });
    updateCropButtons();
    toast("上次裁剪已保存，确认框选后点「接着跑粗排」");
    return;
  }

  // ---- 3) 裁剪请求被中断（fetch 未返回）：任务可能已提交，幂等重提交续跑 ----
  let q = null;
  try { q = JSON.parse(sessionStorage.getItem("yslz_crop_pending") || "null"); } catch (e) {}
  if (q && q.types) {
    sessionStorage.removeItem("yslz_crop_pending");
    if (!q.lastFileName) {
      toast("上次识别未完成（原图未上传成功），请重新上传");
      return;
    }
    lastFileName = q.lastFileName; cropOrigFile = q.lastFileName; updateCacheTip();
    typeSel.value = q.types;
    toast("正在恢复上次被中断的裁剪…");
    startCrop(q.box || null);
  }
})();
</script>
