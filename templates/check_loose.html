m_id": 5530, "item_name": "夜巡苔沼", "type": "鞋子", "image": ""}]}, {"set_id": 879, "set_name": "秘境花颂", "star": "4", "attribute": "华丽", "preview": null, "version": "4.3.1", "total": 6, "owned_cnt": 5, "owned_items": [{"item_id": 6098, "item_name": "春藏花信", "type": "耳饰", "image": "", "owned": 1}, {"item_id": 6099, "item_name": "秘境花颂", "type": "连衣裙", "image": "", "owned": 1}, {"item_id": 6100, "item_name": "繁花绮梦", "type": "发饰", "image": "", "owned": 1}, {"item_id": 6101, "item_name": "花绘心语", "type": "手套", "image": "", "owned": 1}, {"item_id": 6103, "item_name": "蝶庭漫舞", "type": "鞋子", "image": "", "owned": 1}], "items": [{"item_id": 6102, "item_name": "花间巡游", "type": "袜子", "image": ""}]}, {"set_id": 892, "set_name": "织心夜曲", "star": "4", "attribute": "清纯", "preview": null, "version": "4.3.1", "total": 6, "owned_cnt": 4, "owned_items": [{"item_id": 6175, "item_name": "慵风入梦", "type": "鞋子", "image": "", "owned": 1}, {"item_id": 6176, "item_name": "曼妙轻呢", "type": "颈饰", "image": "", "owned": 1}, {"item_id": 6178, "item_name": "织心夜曲", "type": "上衣", "image": "", "owned": 1}, {"item_id": 6180, "item_name": "绯夜荆棘", "type": "袜子", "image": "", "owned": 1}], "items": [{"item_id": 6177, "item_name": "漫夜缱绻", "type": "下装", "image": ""}, {"item_id": 6179, "item_name": "织梦千寻", "type": "手持物", "image": ""}]}, {"set_id": 902, "set_name": "缤色甜梦", "star": "5", "attribute": "清纯", "preview": null, "version": "4.3.2", "total": 7, "owned_cnt": 2, "owned_items": [{"item_id": 6237, "item_name": "云芙过隙", "type": "袜子", "image": "", "owned": 1}, {"item_id": 6242, "item_name": "甜愈魔法", "type": "脚链", "image": "", "owned": 1}], "items": [{"item_id": 6238, "item_name": "幕下星舞", "type": "鞋子", "image": ""}, {"item_id": 6239, "item_name": "晴雨聆虹", "type": "耳饰", "image": ""}, {"item_id": 6240, "item_name": "烘焙糖果", "type": "发饰", "image": ""}, {"item_id": 6241, "item_name": "甜巧可心", "type": "发型", "image": ""}, {"item_id": 6243, "item_name": "缤色甜梦", "type": "连衣裙", "image": ""}]}];
const list = document.getElementById("sets-list");
const searchInput = document.getElementById("search");
let checked = new Set(); // item_id

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function starHtml(n) { const c = parseInt(n,10); return c ? '<span class="star">'+ "★".repeat(c) +'</span>' : ""; }
function typeOrder(t) {
  const order = ["发型","发饰","帽子","耳饰","面饰","颈饰","外套","上衣","连衣裙","下装","袜子","鞋子","手持物","腕饰","手套","戒指","背饰","翅膀","尾巴","悬浮","斜挎","纹身","脚链","座驾"];
  return order.indexOf(t) >= 0 ? order.indexOf(t) : 99;
}

function render() {
  const q = searchInput.value.trim().toLowerCase();
  const sets = SETS.filter(s => !q || s.set_name.toLowerCase().includes(q));

  list.innerHTML = sets.map((s, i) => {
    const pct = s.total ? Math.round(s.owned_cnt / s.total * 100) : 0;
    const ownedItems = (s.owned_items || []).slice().sort((a,b) => typeOrder(a.type) - typeOrder(b.type));
    const missingItems = s.items.slice().sort((a,b) => typeOrder(a.type) - typeOrder(b.type));
    return `
      <div class="set-card" data-idx="${i}">
        <div class="set-head">
          <img src="${escapeHtml(s.preview || '')}" onerror="this.style.visibility='hidden'">
          <div class="set-info">
            <div class="set-name">${escapeHtml(s.set_name)} ${starHtml(s.star)}</div>
            <div class="set-meta">${escapeHtml(s.attribute || '')} · 免活${s.version ? ' · v' + escapeHtml(s.version) : ''}</div>
          </div>
          <div class="progress">
            <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
            <div class="progress-text">已拥有 ${s.owned_cnt} / ${s.total}</div>
          </div>
          <span class="set-toggle">›</span>
        </div>
        <div class="set-items">
          <div class="section-label">✅ 已拥有（${ownedItems.length}）</div>
          <div class="items-grid">
            ${ownedItems.map(it => `
              <div class="item-row owned">
                <span class="owned-check">✓</span>
                <img src="${escapeHtml(it.image || '')}" data-full="${escapeHtml(it.image || '')}" onerror="this.style.visibility='hidden'">
                <span class="item-name">${escapeHtml(it.item_name)}</span>
                <span class="item-type">${escapeHtml(it.type || '')}</span>
              </div>
            `).join("")}
          </div>
          <div class="section-label">⬜ 缺失（${missingItems.length}）</div>
          <div class="items-grid">
            ${missingItems.map(it => `
              <div class="item-row">
                <input type="checkbox" ${checked.has(it.item_id) ? "checked" : ""} data-id="${it.item_id}">
                <img src="${escapeHtml(it.image || '')}" data-full="${escapeHtml(it.image || '')}" onerror="this.style.visibility='hidden'">
                <span class="item-name">${escapeHtml(it.item_name)}</span>
                <span class="item-type">${escapeHtml(it.type || '')}</span>
              </div>
            `).join("")}
          </div>
        </div>
      </div>`;
  }).join("");

  // 展开/收起
  list.querySelectorAll(".set-head").forEach(h => {
    h.addEventListener("click", () => h.parentElement.classList.toggle("open"));
  });
  // 图片放大
  list.querySelectorAll(".item-row img").forEach(img => {
    img.addEventListener("click", e => {
      e.stopPropagation();
      $("#zoom-img").src = img.dataset.full || img.src;
      $("#zoom-mask").classList.add("show");
    });
  });
  // 勾选
  list.querySelectorAll(".item-row input").forEach(cb => {
    cb.addEventListener("change", () => {
      const id = parseInt(cb.dataset.id, 10);
      if (cb.checked) checked.add(id); else checked.delete(id);
      updateStat();
    });
  });

  document.getElementById("total-sets").textContent = sets.length;
  updateStat();
}

function updateStat() {
  document.getElementById("total-items").textContent = SETS.reduce((n,s)=>n+s.items.length,0);
  document.getElementById("stat").textContent = `勾选 ${checked.size} 件`;
}

// 整套标记齐全
document.getElementById("btn-own-all").addEventListener("click", () => {
  list.querySelectorAll(".set-card.open").forEach(card => {
    card.querySelectorAll(".item-row input").forEach(cb => {
      cb.checked = true;
      checked.add(parseInt(cb.dataset.id, 10));
    });
  });
  updateStat();
});

// 标记勾选为已拥有
document.getElementById("btn-mark").addEventListener("click", async () => {
  if (checked.size === 0) { alert("请先勾选要标记的部件（可展开套装或点「整套标记齐全」）"); return; }
  if (!confirm(`确认将 ${checked.size} 个部件标记为「已拥有」？`)) return;
  let ok = 0, fail = 0;
  for (const id of checked) {
    const r = await fetch("/api/owned", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ item_id: id, owned: 1 })
    });
    if (r.ok) ok++; else fail++;
  }
  alert(`标记完成：成功 ${ok}，失败 ${fail}。刷新页面查看更新。`);
  checked.clear();
  render();
});

searchInput.addEventListener("input", render);
document.getElementById("zoom-mask").addEventListener("click", () => $("#zoom-mask").classList.remove("show"));

render();
</script>
