const tbody = document.getElementById("tbody");
const searchInput = document.getElementById("search");

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function starHtml(n) { const c = parseInt(n,10); return c ? '<span class="star">'+ "★".repeat(c) +'</span>' : "—"; }
function typeOrder(t) {
  const order = ["发型","发饰","帽子","耳饰","面饰","颈饰","外套","上衣","连衣裙","下装","袜子","鞋子","手持物","腕饰","手套","戒指","背饰","翅膀","尾巴","悬浮","斜挎","纹身","脚链","座驾"];
  return order.indexOf(t) >= 0 ? order.indexOf(t) : 99;
}

let checked = new Set();

function render() {
  const q = searchInput.value.trim().toLowerCase();
  const filtered = DATA.filter(r => !q || (r.set_name + r.item_name + r.type + r.attribute).toLowerCase().includes(q));
  filtered.sort((a,b) => a.set_name.localeCompare(b.set_name, 'zh') || typeOrder(a.type) - typeOrder(b.type));

  tbody.innerHTML = filtered.map(r => `
    <tr data-id="${r.id}">
      <td class="check"><input type="checkbox" ${checked.has(r.id) ? "checked" : ""}></td>
      <td><strong>${escapeHtml(r.set_name)}</strong></td>
      <td>${escapeHtml(r.item_name)}</td>
      <td><span class="type-tag">${escapeHtml(r.type || "—")}</span></td>
      <td>${escapeHtml(r.attribute || "—")}</td>
      <td>${starHtml(r.star)}</td>
      <td>${escapeHtml(r.obtain || "—")}</td>
      <td><img src="${escapeHtml(r.image || '')}" data-full="${escapeHtml(r.image_big || r.image || '')}" onerror="this.style.visibility='hidden'"></td>
    </tr>
  `).join("");

  document.querySelectorAll("tbody img").forEach(img => {
    img.addEventListener("click", () => { $("#zoom-img").src = img.dataset.full || img.src; $("#zoom-mask").classList.add("show"); });
  });
  document.querySelectorAll("tbody input[type=checkbox]").forEach(cb => {
    cb.addEventListener("change", () => {
      const id = parseInt(cb.closest("tr").dataset.id, 10);
      if (cb.checked) checked.add(id); else checked.delete(id);
      updateStat();
    });
  });
  updateStat();
}

function updateStat() {
  document.getElementById("stat").textContent = `勾选 ${checked.size} / ${DATA.length} 个`;
}

document.getElementById("btn-mark").addEventListener("click", async () => {
  if (checked.size === 0) { alert("请先勾选要标记的部件"); return; }
  if (!confirm(`确认将 ${checked.size} 个部件标记为「已拥有」？`)) return;
  let ok = 0, fail = 0;
  for (const id of checked) {
    const r = await fetch("/api/owned", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ item_id: id, owned: 1 })
    });
    if (r.ok) ok++; else fail++;
  }
  alert(`标记完成：成功 ${ok} 个，失败 ${fail} 个`);
  checked.clear();
  render();
});

document.getElementById("btn-clear").addEventListener("click", () => { checked.clear(); render(); });
searchInput.addEventListener("input", render);
document.getElementById("zoom-mask").addEventListener("click", () => { $("#zoom-mask").classList.remove("show"); });

render();
</script>
